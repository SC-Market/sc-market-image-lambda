name: Deploy Image Lambda

# Auto-deploys on every push to main, and can also be triggered manually from the
# Actions tab. Building on ubuntu-latest (Linux x64) is more reliable than
# deploying from a dev machine, because build.sh reinstalls Sharp with native
# Linux binaries that match the Lambda runtime.
#
# The implementation lives in the org-level reusable workflow — see
# SC-Market/.github/.github/workflows/deploy-lambda.yml
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# A called workflow only gets the permissions the caller grants, so these must be
# declared here as well as in the reusable workflow.
permissions:
  id-token: write # required for AWS OIDC
  contents: read

jobs:
  deploy:
    uses: SC-Market/.github/.github/workflows/deploy-lambda.yml@main
    with:
      function-name: sc-market-image-lambda
      role-arn: arn:aws:iam::272095582125:role/github-actions-image-lambda-deploy
      aws-region: us-east-2
      node-version: "22" # match Lambda runtime nodejs22.x
      package-command: package
      zip-path: dist/lambda.zip

  # LEGACY (pre-SSM): set the function's runtime environment from this repo's
  # secrets. The CDK repo is private, so on the Free org plan it can't read the
  # org-level secrets. But CloudFormation owns the function's Environment, so any
  # `cdk deploy ImageLambdaStack` wiped these vars (2026-10-26 upload outage).
  # The secrets now live in SSM (/sc-market/image-lambda/*, written by
  # sync-ssm-secrets.yml) and CDK sets SECRETS_SSM_PATH. Once the live function
  # has SECRETS_SSM_PATH this job does nothing: overwriting the env would drop
  # the path and fight CDK. Delete this job after the SSM cutover (README).
  configure-env:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for AWS OIDC
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272095582125:role/github-actions-image-lambda-deploy
          aws-region: us-east-2

      - name: Set Lambda environment variables
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          CDN_URL: ${{ secrets.CDN_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail
          aws lambda wait function-updated --function-name sc-market-image-lambda
          # Prints only the (non-secret) parameter path, or None.
          SSM_PATH=$(aws lambda get-function-configuration \
            --function-name sc-market-image-lambda \
            --query 'Environment.Variables.SECRETS_SSM_PATH' --output text)
          if [ -n "$SSM_PATH" ] && [ "$SSM_PATH" != "None" ]; then
            echo "Function reads its secrets from SSM ($SSM_PATH); CDK owns the environment. Not touching it."
            exit 0
          fi
          # Build the env JSON with jq so secret values never appear on the
          # command line (GitHub also masks them in logs).
          jq -n \
            --arg NODE_ENV production \
            --arg LOG_LEVEL info \
            --arg B2_KEY_ID "$B2_KEY_ID" \
            --arg B2_APP_KEY "$B2_APP_KEY" \
            --arg B2_BUCKET_NAME "$B2_BUCKET_NAME" \
            --arg CDN_URL "$CDN_URL" \
            --arg S3_BUCKET_NAME "$S3_BUCKET_NAME" \
            '{Variables: {NODE_ENV: $NODE_ENV, LOG_LEVEL: $LOG_LEVEL, B2_KEY_ID: $B2_KEY_ID, B2_APP_KEY: $B2_APP_KEY, B2_BUCKET_NAME: $B2_BUCKET_NAME, CDN_URL: $CDN_URL, S3_BUCKET_NAME: $S3_BUCKET_NAME}}' \
            > env.json

          # The code publish (previous job) may still be settling; wait, then
          # apply config, then wait again so the run reflects the final state.
          aws lambda wait function-updated --function-name sc-market-image-lambda
          aws lambda update-function-configuration \
            --function-name sc-market-image-lambda \
            --environment file://env.json \
            --query LastUpdateStatus --output text
          rm -f env.json
          aws lambda wait function-updated --function-name sc-market-image-lambda
