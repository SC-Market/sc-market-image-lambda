name: Sync secrets to SSM

# Copies this repo's image-lambda secrets into SSM Parameter Store as
# SecureString parameters (AWS-managed aws/ssm key, standard tier: free):
#
#   /sc-market/image-lambda/B2_KEY_ID
#   /sc-market/image-lambda/B2_APP_KEY
#   /sc-market/image-lambda/B2_BUCKET_NAME
#   /sc-market/image-lambda/S3_BUCKET_NAME
#   /sc-market/image-lambda/CDN_URL
#
# The lambda reads them at cold start when its env has SECRETS_SSM_PATH (set by
# the CDK ImageLambdaStack), so a CDK deploy can no longer wipe them.
#
# Run it once before the SSM cutover, and again whenever a secret changes.
# Warm lambda instances keep the values they loaded; after a change, run
# "Deploy Image Lambda" too so new instances start with the new values.
# Needs ssm:PutParameter on the path (CDK GitHubOIDCStack).
on:
  workflow_dispatch: {}

permissions:
  id-token: write # required for AWS OIDC
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::272095582125:role/github-actions-image-lambda-deploy
          aws-region: us-east-2

      - name: Write SecureString parameters
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CDN_URL: ${{ secrets.CDN_URL }}
        run: |
          set -euo pipefail
          umask 077
          for NAME in B2_KEY_ID B2_APP_KEY B2_BUCKET_NAME S3_BUCKET_NAME CDN_URL; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::error::Secret $NAME is empty; refusing to write it."
              exit 1
            fi
            # Input JSON via jq so values never appear on a command line.
            jq -n --arg name "/sc-market/image-lambda/$NAME" --arg value "$VALUE" \
              '{Name: $name, Value: $value, Type: "SecureString", Tier: "Standard", Overwrite: true}' \
              > param.json
            VERSION=$(aws ssm put-parameter --cli-input-json file://param.json --query Version --output text)
            rm -f param.json
            echo "Wrote /sc-market/image-lambda/$NAME (version $VERSION)"
          done
